server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # keine Zugriffsprotokolle (siehe Datenschutz), Fehler nur auf stderr
  access_log off;
  error_log /dev/stderr warn;

  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # gebaute Dateien haben einen Hash im Namen und ändern sich nie
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Fotos, Renders, Clips: ein Tag
  location ~* \.(webp|png|jpg|svg|mp4|webm)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # eine Seite: unbekannte Pfade landen auf der Startseite
  location / {
    try_files $uri $uri/ /index.html;
  }
}
